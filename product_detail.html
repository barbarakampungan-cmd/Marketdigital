<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>{{ product.title }}</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<header>

    <nav class="navbar">

        <div class="logo">
            DigitalMarket
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            {% if g.user %}

                <a href="/dashboard">
                    Dashboard
                </a>

                <a href="/logout">
                    Logout
                </a>

            {% else %}

                <a href="/login">
                    Login
                </a>

                <a href="/register">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>

</header>

<!-- ========================= -->
<!-- PRODUCT DETAIL -->
<!-- ========================= -->

<section
style="
max-width:1000px;
margin:50px auto;
padding:20px;
">

    <div
    style="
    display:grid;
    grid-template-columns:1fr;
    gap:30px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    ">

        <!-- IMAGE -->

        <img
        src="{{ product.image }}"
        style="
        width:100%;
        max-height:500px;
        object-fit:cover;
        ">

        <!-- INFO -->

        <div
        style="
        padding:25px;
        ">

            <!-- CATEGORY -->

            <p
            style="
            color:#38bdf8;
            font-weight:bold;
            margin-bottom:15px;
            ">

                {{ product.category }}

            </p>

            <!-- TITLE -->

            <h1
            style="
            font-size:35px;
            margin-bottom:20px;
            color:white;
            ">

                {{ product.title }}

            </h1>

            <!-- DESCRIPTION -->

            <p
            style="
            color:#cbd5e1;
            line-height:1.8;
            margin-bottom:30px;
            ">

                {{ product.description }}

            </p>

            <!-- PRICE -->

            <div
            style="
            font-size:30px;
            font-weight:bold;
            color:#22c55e;
            margin-bottom:30px;
            ">

                Rp {{ product.price }}

            </div>

            <!-- BUTTON CHECKOUT -->

            <a href="/checkout/{{ product.id }}"
            style="
            display:block;
            text-align:center;
            background:#38bdf8;
            padding:18px;
            border-radius:12px;
            color:white;
            text-decoration:none;
            font-size:18px;
            font-weight:bold;
            ">

                Checkout Produk

            </a>

            <!-- BACK -->

            <a href="/"
            style="
            display:block;
            text-align:center;
            margin-top:20px;
            color:#38bdf8;
            text-decoration:none;
            ">

                ← Kembali ke Homepage

            </a>

        </div>

    </div>

</section>

</body>
</html>
