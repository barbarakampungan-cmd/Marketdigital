<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Upload Produk</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<section class="login-page">

    <div class="login-box">

        <!-- ========================= -->
        <!-- TITLE -->
        <!-- ========================= -->

        <h1>
            Upload Produk Digital
        </h1>

        <p
        style="
        text-align:center;
        margin-bottom:30px;
        color:#94a3b8;
        ">

            Upload ebook, template,
            preset, course, dan file digital lainnya

        </p>

        <!-- ========================= -->
        <!-- FORM -->
        <!-- ========================= -->

        <form
        method="POST"
        enctype="multipart/form-data">

            <!-- TITLE -->

            <input
            type="text"
            name="title"
            placeholder="Judul Produk"
            required>

            <!-- DESCRIPTION -->

            <textarea
            name="description"
            placeholder="Deskripsi Produk"
            required
            style="
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            margin-bottom:15px;
            min-height:120px;
            resize:none;
            font-size:16px;
            "></textarea>

            <!-- PRICE -->

            <input
            type="number"
            name="price"
            placeholder="Harga Produk"
            required>

            <!-- CATEGORY -->

            <select
            name="category"
            required
            style="
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            margin-bottom:15px;
            font-size:16px;
            ">

                <option value="">
                    Pilih Kategori
                </option>

                <option value="Ebook">
                    Ebook
                </option>

                <option value="Template">
                    Template
                </option>

                <option value="Preset">
                    Preset
                </option>

                <option value="Course">
                    Course
                </option>

            </select>

            <!-- IMAGE -->

            <label
            style="
            display:block;
            margin-bottom:10px;
            font-weight:bold;
            color:white;
            ">

                Upload Gambar Produk

            </label>

            <input
            type="file"
            name="image"
            accept="image/*"
            required
            style="
            margin-bottom:20px;
            color:white;
            ">

            <!-- FILE DIGITAL -->

            <label
            style="
            display:block;
            margin-bottom:10px;
            font-weight:bold;
            color:white;
            ">

                Upload File Produk

            </label>

            <input
            type="file"
            name="file"
            required
            style="
            margin-bottom:20px;
            color:white;
            ">

            <!-- BUTTON -->

            <button type="submit">

                Upload Produk

            </button>

        </form>

        <!-- ========================= -->
        <!-- BACK -->
        <!-- ========================= -->

        <a href="/dashboard"
        style="
        display:block;
        text-align:center;
        margin-top:25px;
        color:#38bdf8;
        text-decoration:none;
        font-weight:bold;
        ">

            ← Kembali ke Dashboard

        </a>

    </div>

</section>

</body>
</html>
